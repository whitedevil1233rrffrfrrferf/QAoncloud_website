<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="130" height="129" viewBox="0 0 130 129">
  <defs>
    <pattern id="pattern" preserveAspectRatio="none" width="100%" height="100%" viewBox="0 0 128 128">
      <image width="128" height="128" xlink:href="data:image/png;base64,"/>
    </pattern>
    <filter id="laptop" x="0" y="0" width="130" height="129" filterUnits="userSpaceOnUse">
      <feOffset dx="10" dy="10" input="SourceAlpha"/>
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feFlood flood-opacity="0.161"/>
      <feComposite operator="in" in2="blur"/>
      <feComposite in="SourceGraphic"/>
    </filter>
  </defs>
  <g transform="matrix(1, 0, 0, 1, 0, 0)" filter="url(#laptop)">
    <rect id="laptop-2" data-name="laptop" width="100" height="99" transform="translate(5 5)" fill="url(#pattern)"/>
  </g>
</svg>
