<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="133" height="133" viewBox="0 0 133 133">
  <defs>
    <filter id="landing-page" x="0" y="0" width="133" height="133" filterUnits="userSpaceOnUse">
      <feOffset dx="10" dy="10" input="SourceAlpha"/>
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feFlood flood-opacity="0.161"/>
      <feComposite operator="in" in2="blur"/>
      <feComposite in="SourceGraphic"/>
    </filter>
  </defs>
  <g transform="matrix(1, 0, 0, 1, 0, 0)" filter="url(#landing-page)">
    <image id="landing-page-2" data-name="landing-page" width="103" height="103" transform="translate(5 5)" xlink:href="data:image/png;base64,"/>
  </g>
</svg>
