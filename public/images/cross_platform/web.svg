<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="142" height="142" viewBox="0 0 142 142">
  <defs>
    <filter id="web" x="0" y="0" width="142" height="142" filterUnits="userSpaceOnUse">
      <feOffset dx="10" dy="10" input="SourceAlpha"/>
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feFlood flood-opacity="0.161"/>
      <feComposite operator="in" in2="blur"/>
      <feComposite in="SourceGraphic"/>
    </filter>
  </defs>
  <g transform="matrix(1, 0, 0, 1, 0, 0)" filter="url(#web)">
    <image id="web-2" data-name="web" width="112" height="112" transform="translate(5 5)" xlink:href="data:image/png;base64,"/>
  </g>
</svg>
