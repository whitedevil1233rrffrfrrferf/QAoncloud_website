<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="125" height="125" viewBox="0 0 125 125">
  <defs>
    <filter id="operative-system" x="0" y="0" width="125" height="125" filterUnits="userSpaceOnUse">
      <feOffset dx="10" dy="10" input="SourceAlpha"/>
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feFlood flood-opacity="0.161"/>
      <feComposite operator="in" in2="blur"/>
      <feComposite in="SourceGraphic"/>
    </filter>
  </defs>
  <g transform="matrix(1, 0, 0, 1, 0, 0)" filter="url(#operative-system)">
    <image id="operative-system-2" data-name="operative-system" width="95" height="95" transform="translate(5 5)" xlink:href="data:image/png;base64,"/>
  </g>
</svg>
